[project]
name = "quicktranslate"
version = "1.7.1"
description = "Lightweight Windows tray translator using OpenRouter, DeepSeek, and Codex"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "PySide6==6.11.2",
    "keyboard>=0.13.5",
    "requests>=2.32.3",
]

[project.gui-scripts]
quicktranslate = "quicktranslate.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyside6-project]
files = [
    "QuickTranslate.pyw",
    "src/quicktranslate/__init__.py",
    "src/quicktranslate/app.py",
    "src/quicktranslate/codex_client.py",
    "src/quicktranslate/hotkey.py",
    "src/quicktranslate/image_input.py",
    "src/quicktranslate/model_catalog.py",
    "src/quicktranslate/model_profiles.py",
    "src/quicktranslate/popup.py",
    "src/quicktranslate/resources_rc.py",
    "src/quicktranslate/settings.py",
    "src/quicktranslate/settings_dialog.py",
    "src/quicktranslate/translator.py",
]

[tool.ruff]
target-version = "py314"
line-length = 100
