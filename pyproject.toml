[project]
name = "quicktranslate"
version = "0.2.0"
description = "Lightweight Windows tray translator using OpenRouter and DeepSeek"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8.0",
    "keyboard>=0.13.5",
    "requests>=2.32.3",
]

[project.scripts]
quicktranslate = "quicktranslate.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
