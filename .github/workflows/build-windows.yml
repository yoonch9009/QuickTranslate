name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --noconsole --name QuickTranslate --paths src run_quicktranslate.pyw

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickTranslate-windows
          path: dist/QuickTranslate
